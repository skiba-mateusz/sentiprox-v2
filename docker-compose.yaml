services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: sentiprox
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --requirepass password --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  proxy:
    build:
      context: ./proxy
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ml-service
      - redis
      - dvwa

  dashboard:
    build:
      context: ./proxy
      dockerfile: ./Dockerfile.dashboard
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - redis

  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "5000:80"

volumes:
  db-data:
  redis-data:

services:
  postgres:
    image: postgres:16.3
    environment:
      POSTGRES_DB: sentiprox
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  proxy:
    build: ./proxy
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - ml-service
      - dvwa

  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "5000:80"

volumes:
  db-data:
